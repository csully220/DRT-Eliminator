[general]
NAME = RaceAmerica;
LOCATION = Garage;
CASCADEFILE = cascade.lightseq.xml

[circles]
; Circle detection:
DP = 1;
; Minimum distance between the centers of the detected circles. If the parameter is too small, multiple neighbor circles may be falsely detected in addition to a true one. If it is too large, some circles may be missed.
MIN_DIST = 20;
; First method-specific parameter. In case of CV_HOUGH_GRADIENT , it is the higher threshold of the two passed to the Canny() edge detector (the lower one is twice smaller).
CANNY_EDGE = 200;
; Second method-specific parameter. In case of CV_HOUGH_GRADIENT , it is the accumulator threshold for the circle centers at the detection stage. The smaller it is, the more false circles may be detected. Circles, corresponding to the larger accumulator values, will be returned first.
CENTER_DET = 20;
; MIN_RADIUS in pixels (at 640 x 480), at start line
MIN_RADIUS = 8;
; MAX_RADIUS in pixels (at 640 x 480), at start line
MAX_RADIUS = 20;

[lamps]
;Top left prestage lamp is 0,0; top right is 1,0; red y is 1
; PP|PP
; SS|SS
;  Y|Y
;  Y|Y
;  Y|Y
;  G|G
;  R|R
 
PRESTAGE_Y = 0;
STAGE_Y = 0.188;
Y1_Y = 0.329;
Y2_Y = 0.502;
Y3_Y = 0.796
GRN_Y = 0.831;
RED_Y = 1.0;

ST1_X = 0;
ST2_X = 0.203;
ST3_X = 0.772;
ST4_X = 1.0;

COLUMN1_X = 0.057;
COLUMN2_X = 0.919;

ASPECT_RATIO = 2.3;

[HSV_thresholds]
; Saturation and value May vary with lighting conditions but should be relatively static
WHITE_HUE_LOW  = 0;
WHITE_HUE_HIGH = 40;
WHITE_SAT_LOW  = 0;
WHITE_SAT_HIGH = 40;
WHITE_VAL_LOW  = 250;
WHITE_VAL_HIGH = 255;

YELLOW_HUE_LOW  = 25;
YELLOW_HUE_HIGH = 35;
YELLOW_SAT_LOW  = 0;
YELLOW_SAT_HIGH = 255;
YELLOW_VAL_LOW  = 205;
